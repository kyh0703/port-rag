# PR 검증용. main 으로 가는 PR 마다 lint/test + 도커 빌드 확인.
# 이미지 push 는 하지 않는다.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: port
          POSTGRES_PASSWORD: port
          POSTGRES_DB: port
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U port -d port"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: python3 scripts/prepare_migrations.py
      - run: uv run ruff check .
      - run: uv run pytest -n 2
        env:
          TEST_RAG_DATABASE_URL: postgresql+asyncpg://port:port@127.0.0.1:5432/port

      # 이미지가 실제로 빌드되는지만 확인 (push=false).
      # RAG Dockerfile 은 별도 runner stage 를 두지 않는다.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
